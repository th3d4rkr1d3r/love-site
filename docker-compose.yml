services:
  postgres:
    image: postgres:16-alpine
    container_name: love-site-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: love
      POSTGRES_PASSWORD: love
      POSTGRES_DB: lovesite
    volumes:
      - love_site_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love -d lovesite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  love_site_pg:
